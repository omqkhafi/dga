name: CI

# A pull request runs only the jobs its changes can affect (scripts/ci/affected.ts decides, see
# CONTRIBUTING.md). A push to main, and anything that script cannot classify, runs everything.
# Make `CI result` the required check: it passes when every job that ran passed and fails when
# one failed or was cancelled; skipped jobs do not count against it. When a newer push cancels
# the whole run, the report and result jobs are skipped instead of reporting red on the old commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main never cancel each other:
# each commit gets its own group, so every push to main finishes the full suite.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      changelog_test: ${{ steps.plan.outputs.changelog_test }}
      check: ${{ steps.plan.outputs.check }}
      install: ${{ steps.plan.outputs.install }}
      install_items: ${{ steps.plan.outputs.install_items }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_groups: ${{ steps.plan.outputs.e2e_groups }}
      e2e_components: ${{ steps.plan.outputs.e2e_components }}
      e2e_shards: ${{ steps.plan.outputs.e2e_shards }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
      lighthouse: ${{ steps.plan.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bun scripts/ci/affected.ts \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}"
          else
            bun scripts/ci/affected.ts --files none
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint

  changelog:
    name: CHANGELOG test
    needs: changes
    if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.changelog_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test scripts/changelog.test.ts

  verify:
    name: Unit tests, translations, typecheck
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Test
        run: bun run test
      - name: Translations are in sync
        run: bun run translations:check
      - name: Typecheck
        run: bun run typecheck

  build:
    name: Tokens, API, registry, docs build
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Next.js keeps its compiler and image caches here; restore the newest and add to it.
      - uses: actions/cache@v4
        with:
          path: apps/docs/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/**/*.ts', 'apps/docs/**/*.tsx', 'apps/docs/**/*.mdx', 'registry/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-
      - name: Tokens are up to date (includes the contrast audit)
        run: bun run tokens:check
      - name: API reference is up to date
        run: bun run api:check
      - name: Registry build
        run: bun run registry:build
      - name: Registry output is committed
        run: git diff --exit-code -- apps/docs/public/r apps/docs/registry apps/docs/lib/generated registry
      - name: Docs build
        run: bun run --filter docs build
      # Built once here; the browser and Lighthouse jobs download it instead of building again.
      - name: Pack the build for the browser jobs
        if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.lighthouse == 'true'
        run: tar --zstd -cf docs-build.tar.zst -C apps/docs --exclude=.next/cache .next
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.lighthouse == 'true'
        with:
          name: docs-build
          path: docs-build.tar.zst
          compression-level: 0
          retention-days: 1

  install:
    name: Install the registry in fresh Next.js apps
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install ${{ needs.changes.outputs.install_items == 'all' && 'every item' || needs.changes.outputs.install_items }}
        run: bun run test:install
        env:
          INSTALL_ITEMS: ${{ needs.changes.outputs.install_items }}

  e2e:
    name: Browser checks (shard ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shards }})
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
      - run: tar --zstd -xf docs-build.tar.zst -C apps/docs
      - name: Start the docs site
        run: |
          bun run --filter docs start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/en > /dev/null && exit 0; sleep 1; done
          echo "The docs site did not start" && exit 1
      - name: Run shard ${{ matrix.shard }}
        run: bun run test:e2e
        env:
          E2E_GROUPS: ${{ needs.changes.outputs.e2e_groups }}
          E2E_COMPONENTS: ${{ needs.changes.outputs.e2e_components }}
          E2E_SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_shards }}
          E2E_REPORT: e2e-report-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: e2e-report-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    name: Browser checks report
    needs: [changes, e2e]
    # !cancelled() instead of always(): when a newer push cancels the run, this job is skipped
    # instead of reporting red on the superseded commit. Real failures still run it.
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-report-*
          merge-multiple: true
      - name: Merge the shard reports
        run: bun scripts/ci/merge-e2e-report.ts e2e-report-*.json
        env:
          E2E_SHARDS: ${{ needs.changes.outputs.e2e_shards }}
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.json
          retention-days: 7

  lighthouse:
    name: Lighthouse (home, button and input pages)
    needs: [changes, build]
    if: needs.changes.outputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
      - run: tar --zstd -xf docs-build.tar.zst -C apps/docs
      # Desktop: performance, accessibility, best practices and SEO must all be at least 95
      # (median of 3 runs). The build fails below that.
      - name: Lighthouse, desktop
        run: bunx @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json
      # Mobile (simulated slow 4G, 4x CPU): accessibility, best practices and SEO fail the
      # build below 95. Mobile performance is reported as a warning because the score moves
      # with the runner's CPU.
      - name: Lighthouse, mobile
        run: bunx @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci

  result:
    name: CI result
    needs: [changes, lint, changelog, verify, build, install, e2e, e2e-report, lighthouse]
    # Skipped (not red) when a newer push cancelled this run; a failure in any job still fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo '${{ toJSON(needs) }}' | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null
