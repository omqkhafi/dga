name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Tokens are up to date
        run: bun run tokens:check
      - name: Registry build
        run: bun run registry:build
      - name: Registry output is committed
        run: git diff --exit-code -- apps/docs/public/r registry
      - name: Typecheck
        run: bun run typecheck
      - name: Docs build
        run: bun run --filter docs build

  install:
    name: Install dga-style in a fresh Next.js app
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:install
