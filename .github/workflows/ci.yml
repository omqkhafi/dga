name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Tokens are up to date
        run: bun run tokens:check
      - name: API reference is up to date
        run: bun run api:check
      - name: Translations are in sync
        run: bun run translations:check
      - name: Registry build
        run: bun run registry:build
      - name: Registry output is committed
        run: git diff --exit-code -- apps/docs/public/r apps/docs/registry apps/docs/lib/generated registry
      - name: Typecheck
        run: bun run typecheck
      - name: Docs build
        run: bun run --filter docs build

  install:
    name: Install the registry in fresh Next.js apps
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:install

  lighthouse:
    name: Lighthouse (home and button page)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Desktop: performance, accessibility, best practices and SEO must all be at least 95
      # (median of 3 runs). The build fails below that.
      - name: Lighthouse, desktop
        run: bunx @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json
      # Mobile (simulated slow 4G, 4x CPU): accessibility, best practices and SEO fail the
      # build below 95. Mobile performance is reported as a warning because the score moves
      # with the runner's CPU.
      - name: Lighthouse, mobile
        run: bunx @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
